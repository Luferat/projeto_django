{% extends 'projectus/_base.html' %}

{% block content %}

<section>

    <h2>Recuperar senha</h2>

    <p>Informe seu e-mail cadastrado para receber o link de recuperação.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar link</button>
    </form>
    <p><a href="{% url 'login' %}">Voltar ao login</a></p>

</section>

{% endblock %}
