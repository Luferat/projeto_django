{% extends 'projectus/_base.html' %}

{% block content %}

<section>

    <h2>Posts Recentes</h2>

    <p>{{ total }} posts.</p>

    {% for post in posts %}

    <div>
        <img src="{{ post.thumbnail }}" alt="{{ post.title }}" width="150">
        <h4><a href="{% url 'post_view' id=post.id  %}">{{ post.title }}</a></h4>
        <p>{{ post.summary }}</p>
    </div>
    <hr>

    {% empty %}

    <p>Não achei nada.</p>

    {% endfor %}

</section>

{% endblock %}
