{% extends 'projectus/_base.html' %}
{% block content %}

<article>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

    </form>

    <p>
        Já possui uma conta?
        <a href="{% url 'login' %}">Entrar</a>
    </p>

</article>

{% endblock %}
